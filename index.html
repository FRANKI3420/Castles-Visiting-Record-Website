<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ記録サイト</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#34495e">
    <link rel="apple-touch-icon" href="numazu.png">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #8e44ad;
            /* 歴史的な重厚感のある紫 */
            --text-color: #e0e0e0;
            --sub-text: #b0b0b0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            color: var(--text-color);
            margin-bottom: 25px;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
            width: 100%;
            padding-bottom: 10px;
        }

        /* メインメニュー：タイル型 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .menu-card {
            background: var(--card-bg);
            padding: 20px 10px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
            border: 1px solid #333;
        }

        .menu-card:active {
            transform: scale(0.95);
            background: #252525;
        }

        .icon {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .menu-title {
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
        }

        /* リストセクション */
        .section-title {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: bold;
            margin: 20px 0 10px 5px;
            text-transform: uppercase;
        }

        .record-list {
            list-style: none;
            padding: 0;
            margin: 0;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .record-list li {
            border-bottom: 1px solid #333;
        }

        .record-list li:last-child {
            border-bottom: none;
        }

        .record-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .record-list a:active {
            background: #252525;
        }

        .arrow {
            color: #555;
            font-size: 0.8rem;
        }

        /* 同期ボタン */
        .auth-section {
            margin-top: 30px;
            padding: 10px;
        }

        #authBtn {
            width: 100%;
            padding: 14px;
            cursor: pointer;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #backupStatus {
            font-size: 11px;
            color: var(--sub-text);
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>🏰 コレクション記録ポータル</h1>

    <div class="section-title">お城</div>
    <div class="menu-grid">
        <a href="100catsle.html" class="menu-card">
            <span class="icon">🏯</span>
            <span class="menu-title">日本100名城</span>
        </a>
        <a href="index2.html" class="menu-card">
            <span class="icon">⚔️</span>
            <span class="menu-title">続100名城</span>
        </a>
        <a href="catsle_card.html" class="menu-card">
            <span class="icon">🎴</span>
            <span class="menu-title">100名城カード</span>
        </a>
        <a href="catsle_card_zoku.html" class="menu-card">
            <span class="icon">🎴</span>
            <span class="menu-title">続100名城カード</span>
        </a>
        <a href="catsle_medal.html" class="menu-card">
            <span class="icon">🏅</span>
            <span class="menu-title">城メダル</span>
        </a>
    </div>

    <div class="section-title">タワー</div>
    <div class="menu-grid">
        <a href="tower.html" class="menu-card">
            <span class="icon">🗼</span>
            <span class="menu-title">タワーメダル</span>
        </a>
    </div>

    <div class="section-title">御朱印関連</div>
    <ul class="record-list">
        <li><a href="goshoin.html"><span>✈️ 御翔印 (JAL)</span> <span class="arrow">▶</span></a></li>
        <li><a href="gokain.html"><span>🍡 御菓印 (和菓子)</span> <span class="arrow">▶</span></a></li>
    </ul>

    <div class="auth-section">
        <button id="authBtn" onclick="handleAuthClick()">Google Cloud 同期</button>
        <div id="backupStatus">最終同期: 未実施</div>
    </div>

    <script src="googleAuth.js"></script>

</body>

</html>
