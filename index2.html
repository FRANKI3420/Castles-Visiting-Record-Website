    <h1>続100名城訪問記録</h1>

                <!-- 地図を表示するためのコンテナ -->
                <div id="map"></div>
            </div>
        </div>

        <div class="content" id="content">
            <header>

                    <img id="image1" src="img/tsunomre.jpg" alt="角牟礼城">

                <label for="region" style="font-size: 20px;">エリア選択:</label>
                <select id="region" name="region" style="font-size: 20px;">
                    <option value="未選択">未選択</option>
                    <option value="北海道・東北地方">北海道・東北地方</option>
                    <option value="関東・甲信越地方">関東・甲信越地方</option>
                    <option value="北陸・東海地方">北陸・東海地方</option>
                    <option value="近畿地方">近畿地方</option>
                    <option value="中国・四国地方">中国・四国地方</option>
                    <option value="九州・沖縄地方">九州・沖縄地方</option>
                </select>
                <br>
                <div style="margin: 10px 0;"></div> <!-- 縦の隙間 -->

                <label for="catsle" style="font-size: 20px;">お城選択:</label>
                <select id="catsle" name="catsle" style="font-size: 20px;">
                </select>

                <br>
                <div style="margin: 10px 0;"></div> <!-- 縦の隙間 -->

                <label for="selectedDate" style="font-size: 20px;">訪れた日付の選択:</label>
                <input type="date" id="selectedDate" name="selectedDate" style="font-size: 20px;">

                <br>
                <div style="margin: 10px 0;"></div> <!-- 縦の隙間 -->

                <button onclick="saveData()" style="font-size: 20px;">データを保存</button>
                <br>
                <div style="margin: 10px 0;"></div> <!-- 縦の隙間 -->
                <hr class="divider">

                <div style="width: 100%; max-width: 500px; margin: 20px 0;">
                    <canvas id="visitChart"></canvas>
                </div>
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <br>

                <div style="margin: 10px 0;"></div> <!-- 縦の隙間 -->


                <button onclick="displayStoredData()">保存データを表示(ID順)</button>
                <button onclick="displayStoredData2()">保存データを表示(日付順)</button>
                <div>
                    <button onclick="kakusu2()">非表示</button>
                </div>
                <div id="savedData"></div>
                <div style="margin: 30px 0;"></div> <!-- 縦の隙間 -->

                <!--  
                <div id="map-container">
                    <div id="map"></div>
                </div>
                -->
                <section class="unvisited-panel">
                    <div class="panel-header">
                        <h3>🚩 未訪問のお城</h3>
                    </div>
                    <button id="btn-toggle-unvisited" onclick="toggleUnvisitedList()" class="btn-outline full-width">
                        未訪問のお城を表示
                    </button>
                    <div id="nameList"></div>
                </section>

                <section class="admin-panel">
                    <div class="panel-header">
                        <h3>⚙️ データ管理</h3>
                    </div>

                    <div class="admin-sub-section">
                        <div class="button-row">
                            <button id="btn-toggle-delete" onclick="toggleDeleteList()" class="btn-manage">
                                削除リストを表示
                            </button>
                        </div>
                        <div id="recordList" style="display: none;"></div>
                    </div>
                </section>


                <br>



                <button onclick="reset()">記録をリセットする</button>
                <br>
                <div style="margin: 10px 0;"></div> <!-- 縦の隙間 -->

                <!-- データをCSVで出力するボタン -->
                <button onclick="outputCSV()">CSVで出力</button>

                <br>
                <div style="margin: 10px 0;"></div> <!-- 縦の隙間 -->

                <button onclick="document.getElementById('csvInput').click()">CSV読み込み</button>
                <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="inputCSV()">
                <pre id="output"></pre>
                <button id="loadButton" style="display:none" onclick="addData()">読み込んだデータを追加する</button>

                <!-- Leaflet JavaScriptファイルを読み込む -->

            </header>
        </div>
        </header>
