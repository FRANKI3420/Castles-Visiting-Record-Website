    <header style="padding: 0 10px;">
        <h1>日本100名城 訪問記録</h1>
    </header>
    <div class="mapzone" id="mapzone">
        <div class="section-title">
            <!-- <h2>Map</h2> -->
            <button onclick="setCurrentLocation()" class="btn-location">📍 現在地へ</button>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <div class="content" id="content">
        <header>

            <div id="image-container" class="top-gallery">
                <img id="image1" src="img/備中松山城.jpg" alt="備中松山城">
                <img id="image1" src="img/himeji.jpg" alt="姫路城">
            </div>

            <section class="control-panel">
                <h3>🏠 記録を登録する</h3>
                <div class="input-group">
                    <div class="field">
                        <label for="region">エリア選択</label>
                        <select id="region" name="region">
                            <option value="未選択">未選択</option>
                            <option value="北海道・東北">北海道・東北</option>
                            <option value="関東">関東</option>
                            <option value="甲信越・北陸">甲信越・北陸</option>
                            <option value="東海・近畿">東海・近畿</option>
                            <option value="中国・四国">中国・四国</option>
                            <option value="九州・沖縄">九州・沖縄</option>
                            <option value="国宝5名城">国宝5名城</option>
                            <option value="現存12天守">現存12天守</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="catsle">お城選択</label>
                        <select id="catsle" name="catsle"></select>
                    </div>
                    <div class="field">
                        <label for="selectedDate">訪れた日付</label>
                        <input type="date" id="selectedDate" name="selectedDate">
                    </div>
                </div>
                <button onclick="saveData()" class="btn-save">データを保存</button>
            </section>

            <hr class="divider">

            <section class="display-panel">
                <div class="panel-header">
                    <h3>📊 訪問データの表示</h3>
                    <button onclick="kakusu2()" class="btn-hide">非表示</button>
                </div>
                <div class="button-row">
                    <button onclick="displayStoredData()" class="btn-outline">ID順で表示</button>
                    <button onclick="displayStoredData2()" class="btn-outline">日付順で表示</button>
                </div>
                <div style="width: 100%; max-width: 500px; margin: 20px 0;">
                    <canvas id="visitChart"></canvas>
                </div>
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                <div id="savedData"></div>
            </section>

            <section class="unvisited-panel">
                <div class="panel-header">
                    <h3>🚩 未訪問のお城</h3>
                </div>
                <button id="btn-toggle-unvisited" onclick="toggleUnvisitedList()" class="btn-outline full-width">
                    未訪問のお城を表示
                </button>
                <div id="nameList"></div>
            </section>

            <section class="admin-panel">
                <div class="panel-header">
                    <h3>⚙️ データ管理</h3>
                </div>

                <div class="admin-sub-section">
                    <div class="button-row">
                        <button id="btn-toggle-delete" onclick="toggleDeleteList()" class="btn-manage">
                            削除リストを表示
                        </button>
                    </div>
                    <div id="recordList" style="display: none;"></div>
                </div>
            </section>

            <br>

            <div class="admin-sub-section data-tools">

                <button onclick="outputCSV()" class="btn-csv">CSV書き出し</button>
                <button onclick="document.getElementById('csvInput').click()" class="btn-csv">CSV読み込み</button>
                <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="inputCSV()">
                <button onclick="reset()" class="btn-reset">全記録リセット</button>
            </div>

            <pre id="output"></pre>
            <button id="loadButton" class="btn-save" style="display:none" onclick="addData()">読み込んだデータを追加する</button>
            </section>
        </header>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="main.js"></script>
    <a href="index.html" style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 50px;
        height: 50px;
        background-color: #34495e;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-size: 1.5rem;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        z-index: 1000;
    ">🏠</a>
</body>
